<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#bc8cff"/>
      <stop offset="100%" style="stop-color:#f778ba"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  <rect x="0" y="188" width="800" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
  <!-- Network nodes -->
  <circle cx="120" cy="100" r="18" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  <circle cx="120" cy="100" r="6" fill="#58a6ff" opacity="0.8"/>
  <circle cx="60" cy="60" r="10" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="60" cy="60" r="4" fill="#58a6ff" opacity="0.5"/>
  <circle cx="60" cy="140" r="10" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="60" cy="140" r="4" fill="#58a6ff" opacity="0.5"/>
  <circle cx="170" cy="55" r="10" fill="none" stroke="#bc8cff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="170" cy="55" r="4" fill="#bc8cff" opacity="0.5"/>
  <circle cx="170" cy="145" r="10" fill="none" stroke="#bc8cff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="170" cy="145" r="4" fill="#bc8cff" opacity="0.5"/>
  <!-- Connection lines -->
  <line x1="68" y1="66" x2="108" y2="90" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  <line x1="68" y1="134" x2="108" y2="110" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  <line x1="132" y1="88" x2="162" y2="62" stroke="#bc8cff" stroke-width="1" opacity="0.3"/>
  <line x1="132" y1="112" x2="162" y2="138" stroke="#bc8cff" stroke-width="1" opacity="0.3"/>
  <!-- Arrow indicating pivot -->
  <path d="M185 100 L215 100" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <path d="M210 95 L220 100 L210 105" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <!-- Title -->
  <text x="240" y="95" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white" letter-spacing="-1">Pivot</text>
  <text x="400" y="95" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="url(#accent)" letter-spacing="-1">Strike</text>
  <!-- Subtitle -->
  <text x="242" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#8b949e" letter-spacing="3">LAYER-3 NETWORK PIVOTING FRAMEWORK</text>
  <!-- Right side decoration -->
  <circle cx="700" cy="70" r="8" fill="none" stroke="#f778ba" stroke-width="1.5" opacity="0.3"/>
  <circle cx="700" cy="70" r="3" fill="#f778ba" opacity="0.4"/>
  <circle cx="740" cy="100" r="12" fill="none" stroke="#f778ba" stroke-width="1.5" opacity="0.3"/>
  <circle cx="740" cy="100" r="5" fill="#f778ba" opacity="0.4"/>
  <circle cx="700" cy="130" r="8" fill="none" stroke="#f778ba" stroke-width="1.5" opacity="0.3"/>
  <circle cx="700" cy="130" r="3" fill="#f778ba" opacity="0.4"/>
  <line x1="706" y1="76" x2="734" y2="94" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
  <line x1="706" y1="124" x2="734" y2="106" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
</svg>
